services:
  app:
    build: .
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./.docker/data:/app/data
    environment:
      - SQLITE_PATH=/app/data/sqlite.db

  postgres:
    image: pgvector/pgvector:pg17
    container_name: tab-projects-pg
    ports:
      - "${PG_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tab_projects}
      POSTGRES_USER: ${POSTGRES_USER:-tab_projects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tab_projects}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tab_projects"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tab-projects-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  pg-data:
  ollama-data:
