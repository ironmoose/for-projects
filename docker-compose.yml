services:
  app:
    build: .
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tab_projects}:${POSTGRES_PASSWORD:-tab_projects}@postgres:5432/${POSTGRES_DB:-tab_projects}
      - SQLITE_PATH=/app/data/sqlite.db
      - EMBEDDINGS_ENABLED=true
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./.local/data:/app/data:ro

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: tab-projects-pg
    ports:
      - "${PG_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tab_projects}
      POSTGRES_USER: ${POSTGRES_USER:-tab_projects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tab_projects}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tab_projects"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.20.4
    container_name: tab-projects-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama-pull:
    image: ollama/ollama:0.20.4
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama show nomic-embed-text >/dev/null 2>&1 && echo 'model already present' || ollama pull nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: on-failure

volumes:
  pg-data:
  ollama-data:
